openapi: 3.1.0
info:
  title: service API
  version: 1.0.0
paths: {}
components:
  schemas:
    ProblemDetails:
      type: object
      properties:
        status:
          type: integer
    ServiceNotFoundParams:
      type: object
      required:
        - serviceName
      properties:
        serviceName:
          type: string
    ServiceNotFoundProblem:
      allOf:
        - $ref: "#/components/schemas/ProblemDetails"
        - type: object
          required:
            - code
            - params
          properties:
            code:
              type: string
              const: service.error.not-found
              x-i18n:
                message: "Service {serviceName} was not found."
            params:
              $ref: "#/components/schemas/ServiceNotFoundParams"
