name: Validate locale catalogs

on:
  pull_request:
    paths:
      - locales/translation-template.json
      - src/locales/**
      - scripts/**
      - package.json
      - package-lock.json

jobs:
  validate:
    uses: RedHatInsights/i18n-tooling/.github/workflows/i18n-validate.yml@<reviewed-commit-sha>
    with:
      package-manager: npm
      validation-command: i18n:validate
      catalog-adapter: formatjs-json
      catalog-path: locales/translation-template.json
      catalog-role: source
      catalog-locale: en
    permissions:
      contents: read
