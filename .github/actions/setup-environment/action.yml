name: Set up Node.js and npm
description: Use the tooling Node and packageManager pins, with optional npm caching

inputs:
  node-version:
    description: Explicit compatibility or consumer runtime override
    default: ""
  working-directory:
    description: Tooling checkout containing .nvmrc and package.json
    default: .
  cache:
    description: Cache npm downloads; disable for privileged jobs
    default: "true"

runs:
  using: composite
  steps:
    # v5+ caches npm automatically when package.json declares packageManager;
    # turn that off so the cache input alone decides, keeping privileged jobs uncached.
    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: ${{ inputs.node-version == '' && format('{0}/.nvmrc', inputs.working-directory) || '' }}
        package-manager-cache: false
        cache: ${{ inputs.cache == 'true' && 'npm' || '' }}
        cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

    - name: Enable the npm version declared by the tooling # zizmor: ignore[adhoc-packages] -- Pinned Corepack bootstrap; npm version comes from packageManager.
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        npm install --global corepack@0.34.0
        corepack enable npm
        corepack install --global "$(node -p "require('./package.json').packageManager")"
        npm --version
