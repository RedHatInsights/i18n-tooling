name: npm release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to resume
        required: true
        type: string

permissions: {}

concurrency:
  group: npm-release
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  preflight:
    name: Check release eligibility
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    outputs:
      sha: ${{ steps.eligibility.outputs.sha }}
    steps:
      - name: Check out release tag without executing it
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js # zizmor: ignore[cache-poisoning] -- v4 has no automatic dependency caching.
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Check eligibility using the policy on protected main
        id: eligibility
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          policy="$(mktemp -d)"
          trap 'rm -rf "$policy"' EXIT
          git show origin/main:scripts/release-check.mjs > "$policy/release-check.mjs"
          git show origin/main:scripts/set-version.mjs > "$policy/set-version.mjs"
          RELEASE_SHA="$(git rev-parse HEAD)"
          export RELEASE_SHA
          POLICY_MODULE="$policy/release-check.mjs" node --input-type=module -e 'const { main } = await import(process.env.POLICY_MODULE); await main();'
          printf 'sha=%s\n' "$RELEASE_SHA" >> "$GITHUB_OUTPUT"

  release:
    name: Publish npm packages
    needs: preflight
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checkout still matches the approved commit
        env:
          APPROVED_SHA: ${{ needs.preflight.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$APPROVED_SHA"

      - name: Set up Node.js and npm without dependency caching
        uses: $/.github/actions/setup-environment
        with:
          node-version: 24
          cache: "false"

      - name: Install frozen dependencies
        run: npm ci

      - name: Validate and build packages
        run: npm run check

      - name: Publish plugin then CLI, resuming existing versions
        run: |
          for package in eslint-plugin-i18n i18n-pipeline; do
            (
              cd "packages/$package"
              name="$(node -p "require('./package.json').name")"
              version="$(node -p "require('./package.json').version")"
              lookup="$(mktemp)"
              if npm view "$name@$version" version --json > "$lookup"; then
                if [[ "$(jq -r '.' "$lookup")" != "$version" ]]; then
                  echo "Registry returned an unexpected version for $name@$version" >&2
                  exit 1
                fi
                echo "Skipping existing $name@$version"
              elif [[ "$(jq -r '.error.code // empty' "$lookup")" == "E404" ]]; then
                npm publish
              else
                cat "$lookup" >&2
                echo "Registry lookup failed; refusing to publish" >&2
                exit 1
              fi
              rm -f "$lookup"
            )
          done

      - name: Smoke-test published packages and signatures
        run:
          | # zizmor: ignore[adhoc-packages] -- Intentionally installs freshly published exact versions.
          version="$(node -p "require('./packages/i18n-pipeline/package.json').version")"
          consumer="$(mktemp -d)"
          trap 'rm -rf "$consumer"' EXIT
          cd "$consumer"
          npm init --yes
          # A freshly published version can take a moment to become installable.
          for attempt in 1 2 3 4 5 6; do
            if npm install --ignore-scripts "@redhat-cloud-services/eslint-plugin-i18n@$version" "@redhat-cloud-services/i18n-pipeline@$version"; then
              break
            fi
            if [[ "$attempt" == 6 ]]; then
              echo "Published packages are not installable from the registry" >&2
              exit 1
            fi
            sleep 20
          done
          ./node_modules/.bin/i18n-pipeline version
          npm audit signatures
