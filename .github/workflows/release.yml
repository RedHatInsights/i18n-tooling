name: npm release

on:
  push:
    tags: ["v*"]
  # Dispatch from the same tag to resume a partial release, or with dry-run to check eligibility only.
  workflow_dispatch:
    inputs:
      dry-run:
        type: boolean
        default: false

permissions: {}

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  check:
    name: Check release eligibility
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check eligibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-check.mjs

  release:
    name: Publish npm packages
    if: ${{ !inputs.dry-run }}
    needs: check
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js and npm without dependency caching
        uses: $/.github/actions/setup-environment
        with:
          cache: "false"

      - name: Install frozen dependencies
        run: npm ci

      - name: Validate and build packages
        run: npm run check

      - name: Publish plugin then CLI, skipping existing versions
        run: |
          for package in eslint-plugin-i18n i18n-pipeline; do
            name="$(node -p "require('./packages/$package/package.json').name")"
            version="$(node -p "require('./packages/$package/package.json').version")"
            # A failed lookup falls through to publish, which refuses existing versions.
            if [[ -n "$(npm view "$name@$version" version 2>/dev/null)" ]]; then
              echo "Skipping existing $name@$version"
            else
              npm publish --workspace "packages/$package"
            fi
          done

      - name: Smoke-test published packages and signatures
        run:
          | # zizmor: ignore[adhoc-packages] -- Intentionally installs freshly published exact versions.
          version="$(node -p "require('./packages/i18n-pipeline/package.json').version")"
          cd "$(mktemp -d)"
          # A freshly published version can take a moment to become installable.
          for attempt in 1 2 3 4 5 6; do
            npm install --ignore-scripts "@redhat-cloud-services/eslint-plugin-i18n@$version" "@redhat-cloud-services/i18n-pipeline@$version" && break
            [[ "$attempt" == 6 ]] && { echo "Published packages are not installable" >&2; exit 1; }
            sleep 20
          done
          ./node_modules/.bin/i18n-pipeline version
          npm audit signatures
