name: npm release

on:
  push:
    tags: ["v*"]
  # Resume a partial release by dispatching this workflow from the same tag.
  workflow_dispatch:

permissions: {}

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  release:
    name: Publish npm packages
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      checks: read
      id-token: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      # Runs before any candidate action, install or script.
      - name: Check eligibility using the policy on protected main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git show origin/main:scripts/release-check.mjs > "$RUNNER_TEMP/release-check.mjs"
          node "$RUNNER_TEMP/release-check.mjs"

      - name: Set up Node.js and npm without dependency caching
        uses: $/.github/actions/setup-environment
        with:
          node-version: 24
          cache: "false"

      - name: Install frozen dependencies
        run: npm ci

      - name: Validate and build packages
        run: npm run check

      - name: Publish plugin then CLI, skipping existing versions
        run: |
          for package in eslint-plugin-i18n i18n-pipeline; do
            name="$(node -p "require('./packages/$package/package.json').name")"
            version="$(node -p "require('./packages/$package/package.json').version")"
            # A failed lookup falls through to publish, which refuses existing versions.
            if [[ -n "$(npm view "$name@$version" version 2>/dev/null)" ]]; then
              echo "Skipping existing $name@$version"
            else
              npm publish --workspace "packages/$package"
            fi
          done

      - name: Smoke-test published packages and signatures
        run:
          | # zizmor: ignore[adhoc-packages] -- Intentionally installs freshly published exact versions.
          version="$(node -p "require('./packages/i18n-pipeline/package.json').version")"
          cd "$(mktemp -d)"
          npm init --yes
          # A freshly published version can take a moment to become installable.
          for attempt in 1 2 3 4 5 6; do
            npm install --ignore-scripts "@redhat-cloud-services/eslint-plugin-i18n@$version" "@redhat-cloud-services/i18n-pipeline@$version" && break
            [[ "$attempt" == 6 ]] && { echo "Published packages are not installable" >&2; exit 1; }
            sleep 20
          done
          ./node_modules/.bin/i18n-pipeline version
          npm audit signatures
