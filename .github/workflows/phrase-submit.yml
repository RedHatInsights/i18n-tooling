name: Reusable Phrase submission

on:
  workflow_call:
    inputs:
      config-path:
        description: Consumer repository Phrase workflow configuration
        required: true
        type: string
      environment:
        description: Protected Actions environment that holds the Phrase API token and optional GitHub App secrets
        required: true
        type: string
      node-version:
        description: Optional Node.js override; defaults to the tooling .nvmrc
        required: false
        type: string
        default: ""
      base-ref:
        description: PR base branch; required when repository targets another repository
        required: false
        type: string
        default: ""
      repository:
        description: Optional target repository in owner/name form; defaults to the caller
        required: false
        type: string
        default: ""
      expected-phrase-project:
        description: Optional pin requiring the config and batch to use the reviewed Phrase project UID for hub consumers sharing a credential
        required: false
        type: string
        default: ""
      expected-source-filename:
        description: Optional pin requiring the config, batch, and jobs to use the effective Phrase upload filename; keep it unique per project
        required: false
        type: string
        default: ""
      retry-failed:
        description: Create a new Phrase job for failed batch or locale outcomes of this exact source
        required: false
        type: boolean
        default: false
    secrets:
      # The caller must map each name, even when its value is in the protected environment.
      PHRASE_PLATFORM_API_TOKEN:
        description: The caller must map this name; store the Phrase Platform API token in the protected environment named by the `environment` input
        required: false
      # A Phrase Platform Service Account. Its bot user cannot create jobs, so submit cannot use it.
      # Submit requires PHRASE_PLATFORM_API_TOKEN; never substitute these secrets for it.
      PHRASE_SERVICE_ACCOUNT_CLIENT_ID:
        description: The caller must map this name; store the Service Account client ID in the protected environment named by the `environment` input
        required: false
      PHRASE_SERVICE_ACCOUNT_CLIENT_SECRET:
        description: The caller must map this name; store the Service Account client secret in the protected environment named by the `environment` input
        required: false
      APP_CLIENT_ID:
        description: The caller must map this name; store the App client ID in the protected environment named by the `environment` input; set both APP_CLIENT_ID and APP_PRIVATE_KEY for App mode or leave both unset for GITHUB_TOKEN mode
        required: false
      APP_PRIVATE_KEY:
        description: The caller must map this name; store the App private key in the protected environment named by the `environment` input; set both APP_CLIENT_ID and APP_PRIVATE_KEY for App mode or leave both unset for GITHUB_TOKEN mode
        required: false

jobs:
  submit:
    name: Submit source catalog to Phrase
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    # Separate from reconciliation: one shared group lets a queued reconcile cancel a pending
    # submission. Keyed by config, so configs with their own state branches run in parallel.
    concurrency:
      group: i18n-tms-submit-${{ inputs.repository || github.repository }}-${{ inputs.config-path }}-${{ inputs.base-ref || github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Select GitHub authentication mode and target repository
        id: github-auth
        uses: $/.github/actions/select-github-target
        with:
          app-client-id-set: ${{ secrets.APP_CLIENT_ID != '' }}
          app-private-key-set: ${{ secrets.APP_PRIVATE_KEY != '' }}
          repository: ${{ inputs.repository }}
          base-ref: ${{ inputs.base-ref }}
          require-base-ref: "true"

      - name: Create GitHub App token
        id: create-app-token
        if: steps.github-auth.outputs.mode == 'app'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ steps.github-auth.outputs.target-owner }}
          repositories: ${{ steps.github-auth.outputs.target-name }}
          permission-contents: write

      - name: Check out target consumer repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.github-auth.outputs.target-repository }}
          ref: ${{ steps.github-auth.outputs.checkout-ref }}
          token: ${{ steps.create-app-token.outputs.token || github.token }}
          persist-credentials: false

      - name: Check out i18n tooling source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: i18n-tooling-source
          persist-credentials: false

      - name: Set up Node.js and npm
        uses: $/.github/actions/setup-environment
        with:
          node-version: ${{ inputs.node-version }}
          working-directory: i18n-tooling-source
          cache: "false"

      - name: Install i18n tooling dependencies
        run: npm ci --ignore-scripts
        working-directory: i18n-tooling-source

      - name: Build i18n-pipeline CLI
        run: npm run build --workspace @redhat-cloud-services/i18n-pipeline
        working-directory: i18n-tooling-source

      - name: Submit translation job
        env:
          CONFIG_PATH: ${{ inputs.config-path }}
          I18N_BASE_REF: ${{ inputs.base-ref }}
          RETRY_FAILED: ${{ inputs.retry-failed }}
          EXPECTED_PHRASE_PROJECT: ${{ inputs.expected-phrase-project }}
          EXPECTED_SOURCE_FILENAME: ${{ inputs.expected-source-filename }}
          TARGET_REPOSITORY: ${{ steps.github-auth.outputs.target-repository }}
          CROSS_REPOSITORY: ${{ steps.github-auth.outputs.cross-repository }}
          GITHUB_AUTH_MODE: ${{ steps.github-auth.outputs.mode }}
          APP_SLUG: ${{ steps.create-app-token.outputs.app-slug }}
          PHRASE_PLATFORM_API_TOKEN: ${{ secrets.PHRASE_PLATFORM_API_TOKEN }}
          PHRASE_SERVICE_ACCOUNT_CLIENT_ID: ${{ secrets.PHRASE_SERVICE_ACCOUNT_CLIENT_ID }}
          PHRASE_SERVICE_ACCOUNT_CLIENT_SECRET: ${{ secrets.PHRASE_SERVICE_ACCOUNT_CLIENT_SECRET }}
          GITHUB_TOKEN: ${{ steps.create-app-token.outputs.token || github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
        run: |
          set -eu
          if [ "$GITHUB_AUTH_MODE" = "app" ]; then
            printf 'GitHub auth: app %s[bot]\n' "$APP_SLUG"
          else
            printf 'GitHub auth: GITHUB_TOKEN (github-actions[bot])\n'
          fi
          set -- --repository "$TARGET_REPOSITORY"
          if [ "$RETRY_FAILED" = "true" ]; then set -- "$@" --retry-failed; fi
          if [ -n "$EXPECTED_PHRASE_PROJECT" ]; then set -- "$@" --expect-project "$EXPECTED_PHRASE_PROJECT"; fi
          if [ -n "$EXPECTED_SOURCE_FILENAME" ]; then set -- "$@" --expect-source-filename "$EXPECTED_SOURCE_FILENAME"; fi
          if [ "$CROSS_REPOSITORY" = "true" ]; then
            set -- "$@" --base-ref "$I18N_BASE_REF" --source-commit "$(git rev-parse HEAD)"
          fi
          node "$GITHUB_WORKSPACE/i18n-tooling-source/packages/i18n-pipeline/dist/cli.js" \
            tms submit --config "$CONFIG_PATH" "$@"
