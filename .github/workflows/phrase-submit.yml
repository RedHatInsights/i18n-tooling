name: Reusable Phrase submission

on:
  workflow_call:
    inputs:
      config-path:
        description: Consumer repository Phrase workflow configuration
        required: true
        type: string
      environment:
        description: Protected Actions environment that holds the Phrase API token
        required: true
        type: string
      node-version:
        description: Node.js version used by the CLI
        required: false
        type: string
        default: "22"
      base-ref:
        description: PR base branch for translations; defaults to the dispatched or pushed branch
        required: false
        type: string
        default: ""
      retry-failed:
        description: Create a new Phrase job for failed batch or locale outcomes of this exact source
        required: false
        type: boolean
        default: false
    secrets:
      # Secret names are case-insensitive, so this single name covers both an environment
      # secret in `inputs.environment` and an explicitly mapped repository/organization secret.
      PHRASE_PLATFORM_API_TOKEN:
        description: A user's Phrase Platform API token; prefer an environment secret over explicit mapping
        required: false
      # Preferred for automation: a Phrase Platform Service Account, not tied to a person.
      # Set both of these instead of PHRASE_PLATFORM_API_TOKEN, never alongside it.
      PHRASE_SERVICE_ACCOUNT_CLIENT_ID:
        description: Phrase Platform Service Account client ID
        required: false
      PHRASE_SERVICE_ACCOUNT_CLIENT_SECRET:
        description: Phrase Platform Service Account client secret
        required: false

jobs:
  submit:
    name: Submit source catalog to Phrase
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    # Separate from reconciliation: one shared group lets a queued reconcile cancel a pending
    # submission. State writes are compare-and-swap, so the two may run concurrently.
    concurrency:
      group: i18n-tms-submit-${{ github.repository }}-${{ inputs.base-ref || github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Check out consumer repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check out i18n tooling source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: i18n-tooling-source
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Set up Bun for the tooling workspace
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install i18n tooling dependencies
        run: bun install --frozen-lockfile
        working-directory: i18n-tooling-source

      - name: Build frontend-i18n CLI
        run: npm run build --workspace @redhat-cloud-services/i18n-pipeline
        working-directory: i18n-tooling-source

      - name: Submit translation job
        env:
          CONFIG_PATH: ${{ inputs.config-path }}
          I18N_BASE_REF: ${{ inputs.base-ref }}
          RETRY_FAILED: ${{ inputs.retry-failed }}
          PHRASE_PLATFORM_API_TOKEN: ${{ secrets.PHRASE_PLATFORM_API_TOKEN }}
          PHRASE_SERVICE_ACCOUNT_CLIENT_ID: ${{ secrets.PHRASE_SERVICE_ACCOUNT_CLIENT_ID }}
          PHRASE_SERVICE_ACCOUNT_CLIENT_SECRET: ${{ secrets.PHRASE_SERVICE_ACCOUNT_CLIENT_SECRET }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
        run: |
          set --
          if [ "$RETRY_FAILED" = "true" ]; then set -- --retry-failed; fi
          node "$GITHUB_WORKSPACE/i18n-tooling-source/packages/i18n-pipeline/dist/cli.js" \
            tms submit --config "$CONFIG_PATH" "$@"
