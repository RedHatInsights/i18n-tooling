name: CI

on:
  # Release tags reuse the branch checks of the tagged commit; a tag run would race the release eligibility check.
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lockfile:
    name: Frozen npm lockfile
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js and npm
        uses: $/.github/actions/setup-environment

      - name: Install from frozen npm lockfile
        run: npm ci

      - name: Verify npm lockfile is unchanged
        run: git diff --exit-code -- package-lock.json

  typecheck:
    name: Typecheck (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js and npm
        uses: $/.github/actions/setup-environment
        with:
          # Node 22 reads .nvmrc; Node 24 checks compatibility.
          node-version: ${{ matrix.node-version == 24 && '24' || '' }}

      - name: Install dependencies
        run: npm ci

      - name: Typecheck packages
        run: npm run typecheck

  reusable-cli:
    name: Reusable CLI (${{ matrix.pm }})
    strategy:
      fail-fast: false
      matrix:
        pm: [npm, bun]
    uses: $/.github/workflows/i18n-validate.yml
    with:
      package-manager: ${{ matrix.pm }}
      validation-command: smoke:reusable-cli
      catalog-adapter: icu-json
      catalog-path: packages/i18n-pipeline/tests/fixtures/insights-rbac/i18n-en.json
      source-glob: "packages/*/src/**/*.ts"

  test:
    name: Tests and coverage (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js and npm
        uses: $/.github/actions/setup-environment
        with:
          # Node 22 reads .nvmrc; Node 24 checks compatibility.
          node-version: ${{ matrix.node-version == 24 && '24' || '' }}

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage thresholds
        run: npm run test:coverage

  build:
    name: Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js and npm
        uses: $/.github/actions/setup-environment
        with:
          # Node 22 reads .nvmrc; Node 24 checks compatibility.
          node-version: ${{ matrix.node-version == 24 && '24' || '' }}

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

  lint-format:
    name: Lint and format (Node 22)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js and npm
        uses: $/.github/actions/setup-environment

      - name: Install dependencies
        run: npm ci

      - name: Lint with the repository ESLint plugin
        run: npm run lint:eslint

      - name: Check formatting
        run: npm run format:check

  cli-smoke:
    name: CLI smoke tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js and npm
        uses: $/.github/actions/setup-environment
        with:
          # Node 22 reads .nvmrc; Node 24 checks compatibility.
          node-version: ${{ matrix.node-version == 24 && '24' || '' }}

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Smoke-test CLI version, package path, shebang, and fixture validation
        run: npm run smoke:cli

  schema-contracts:
    name: Schema contracts (Node 22)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js and npm
        uses: $/.github/actions/setup-environment

      - name: Install dependencies
        run: npm ci

      - name: Compile schemas and validate fixtures
        run: npm run check:schemas

  reusable-workflow-self-test:
    name: Reusable i18n workflow self-test
    uses: $/.github/workflows/i18n-validate.yml
    with:
      package-manager: npm
      validation-command: i18n:validate
      catalog-adapter: formatjs-json
      catalog-path: packages/i18n-pipeline/tests/fixtures/rbac-ui/translation-template.json
      source-glob: "packages/*/src/**/*.ts"
      catalog-role: source
      catalog-locale: en
    permissions:
      contents: read

  catalog-only-workflow-self-test:
    name: Reusable catalog-only workflow self-test
    uses: $/.github/workflows/i18n-validate.yml
    with:
      catalog-only: true
      validation-config: packages/i18n-pipeline/tests/fixtures/openapi-i18n/catalog-validation.json
    permissions:
      contents: read

  markdown:
    name: Markdown lint (Node 22)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js and npm
        uses: $/.github/actions/setup-environment

      - name: Install dependencies
        run: npm ci

      - name: Lint Markdown documentation
        run: npm run check:markdown

  links:
    name: Markdown link check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check documentation links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --verbose --no-progress --max-concurrency 2 './README.md' './CONTRIBUTING.md' './docs/**/*.md' './packages/*/README.md'
          lycheeVersion: v0.24.2

  spelling:
    name: Spelling
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check spelling
        uses: crate-ci/typos@512fc24f32f44ab01972217aaaf3dc86ec234d53 # v1.50.2
        with:
          config: typos.toml

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high

  actionlint:
    name: GitHub Actions lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: 1.25.0
          cache: false

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Lint workflow YAML
        # actionlint 1.7.12 does not yet recognize GitHub's job.workflow_* fields or self-repository calls.
        run: |
          "$(go env GOPATH)/bin/actionlint" -color \
            -ignore 'property "workflow_repository" is not defined in object type' \
            -ignore 'property "workflow_sha" is not defined in object type' \
            -ignore 'reusable workflow call "\$/.github/workflows/i18n-validate.yml"' \
            -ignore 'specifying action "\$/.github/actions/setup-environment" in invalid format because ref is missing'

  zizmor:
    name: GitHub Actions security audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Audit GitHub Actions workflows
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          online-audits: false
          advanced-security: false
          annotations: true

  pack-parity:
    name: Pack parity (${{ matrix.pm }}, Node 22.14)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pm: [npm, bun, pnpm]
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js and npm
        uses: $/.github/actions/setup-environment
        with:
          cache: "false"

      - name: Install frozen dependencies
        run: npm ci

      # Consumers test the engines minimum; development-only packages need a newer Node 22 patch.
      - name: Set up consumer Node.js and npm
        uses: $/.github/actions/setup-environment
        with:
          node-version: 22.14.0
          cache: "false"

      - name: Set up Bun
        if: matrix.pm == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Set up pnpm through Corepack
        if: matrix.pm == 'pnpm'
        run: |
          corepack enable pnpm
          corepack prepare pnpm@10.11.0 --activate

      - name: Build the same-commit parity image
        run: docker build -f Containerfile --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "i18n-tooling-parity:$GITHUB_SHA" .

      - name: Compare installed tarballs with the runtime image
        env:
          PACKAGE_MANAGER: ${{ matrix.pm }}
        run: npm run test:pack-parity -- --pm "$PACKAGE_MANAGER" --image "i18n-tooling-parity:$GITHUB_SHA"

  core-validation:
    name: Core validation
    if: always()
    needs:
      - lockfile
      - pack-parity
      - typecheck
      - reusable-cli
      - test
      - build
      - cli-smoke
      - schema-contracts
      - reusable-workflow-self-test
      - catalog-only-workflow-self-test
    runs-on: ubuntu-latest
    steps:
      - name: Require every core check to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed="$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"' <<< "$NEEDS")"
          if [[ -n "$failed" ]]; then
            printf 'Core checks did not all succeed:\n%s\n' "$failed" >&2
            exit 1
          fi

  code-quality:
    name: Code quality
    if: always()
    needs:
      - lint-format
      - markdown
      - spelling
    runs-on: ubuntu-latest
    steps:
      - name: Require every code-quality check to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed="$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"' <<< "$NEEDS")"
          if [[ -n "$failed" ]]; then
            printf 'Code-quality checks did not all succeed:\n%s\n' "$failed" >&2
            exit 1
          fi

  security:
    name: Security checks
    if: always()
    needs:
      - dependency-review
      - actionlint
      - zizmor
    runs-on: ubuntu-latest
    steps:
      - name: Require every applicable security check to succeed
        env:
          EVENT_NAME: ${{ github.event_name }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed="$(jq -r --arg event "$EVENT_NAME" 'to_entries[] | select(.key != "dependency-review" or $event == "pull_request") | select(.value.result != "success") | "\(.key): \(.value.result)"' <<< "$NEEDS")"
          if [[ -n "$failed" ]]; then
            printf 'Security checks did not all succeed:\n%s\n' "$failed" >&2
            exit 1
          fi
