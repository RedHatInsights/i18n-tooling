name: Reusable i18n validation

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version used by the consumer repository
        required: false
        type: string
        default: "22"
      package-manager:
        description: "Dependency installer for the consumer repository: bun or npm"
        required: false
        type: string
        default: bun
      validation-command:
        description: Consumer package script used when validation-config is not set
        required: false
        type: string
        default: i18n:validate
      validation-config:
        description: Optional JSON config for frontend-i18n validate-project; replaces validation-command
        required: false
        type: string
        default: ""
      catalog-only:
        description: Skip consumer dependencies and JavaScript source lint; requires validation-config
        required: false
        type: boolean
        default: false
      catalog-adapter:
        description: Registered catalog adapter ID
        required: false
        type: string
        default: formatjs-json
      catalog-path:
        description: Path to the catalog JSON file
        required: false
        type: string
        default: locales/translation-template.json
      source-glob:
        description: Glob of JavaScript/TypeScript sources to check against the catalog
        required: false
        type: string
        default: "src/**/*.{js,jsx,ts,tsx}"
      catalog-role:
        description: Catalog role, source or target
        required: false
        type: string
        default: source
      catalog-locale:
        description: Locale represented by the catalog
        required: false
        type: string
        default: en
      catalog-config:
        description: Optional JSON config path passed to the selected adapter
        required: false
        type: string
        default: ""

jobs:
  validate:
    name: Validate catalogs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out consumer repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check out i18n tooling source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: i18n-tooling-source
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Set up Bun for the tooling workspace
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Cache Bun dependencies
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'bun.lockb', 'i18n-tooling-source/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache npm dependencies
        if: inputs.package-manager == 'npm' && inputs.catalog-only != true
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json', 'npm-shrinkwrap.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Require validation config for catalog-only mode
        if: inputs.catalog-only == true
        env:
          VALIDATION_CONFIG: ${{ inputs.validation-config }}
        run: |
          if [ -z "$VALIDATION_CONFIG" ]; then
            echo "catalog-only mode requires validation-config" >&2
            exit 1
          fi

      - name: Install consumer dependencies
        if: inputs.catalog-only != true
        env:
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
        run: |
          case "$PACKAGE_MANAGER" in
            bun) bun install --frozen-lockfile ;;
            npm) npm ci ;;
            *)
              echo "Unsupported package manager: $PACKAGE_MANAGER" >&2
              exit 1
              ;;
          esac

      - name: Install i18n tooling dependencies
        run: bun install --frozen-lockfile
        working-directory: i18n-tooling-source

      - name: Build frontend-i18n CLI
        run: npm run build
        working-directory: i18n-tooling-source/packages/i18n-pipeline

      - name: Build source-catalog ESLint plugin
        if: inputs.catalog-only != true
        run: npm run build --workspace @redhat-cloud-services/eslint-plugin-i18n
        working-directory: i18n-tooling-source

      - name: Lint consumer source message IDs
        if: inputs.catalog-only != true
        env:
          I18N_CATALOG_PATH: ${{ inputs.catalog-path }}
          I18N_SOURCE_GLOB: ${{ inputs.source-glob }}
        run: |
          TOOLING_ROOT="$GITHUB_WORKSPACE/i18n-tooling-source"
          "$TOOLING_ROOT/node_modules/.bin/eslint" \
            --no-config-lookup \
            --no-inline-config \
            --config "$TOOLING_ROOT/scripts/eslint-source.config.mjs" \
            "$I18N_SOURCE_GLOB"

      - name: Add frontend-i18n to PATH
        run: |
          CLI="$GITHUB_WORKSPACE/i18n-tooling-source/packages/i18n-pipeline/dist/cli.js"
          CLI_BIN="$RUNNER_TEMP/frontend-i18n-bin"
          CONSUMER_BIN="$GITHUB_WORKSPACE/node_modules/.bin"
          mkdir -p "$CLI_BIN" "$CONSUMER_BIN"
          printf '#!/bin/sh\nexec node "%s" "$@"\n' "$CLI" > "$CLI_BIN/frontend-i18n"
          chmod +x "$CLI_BIN/frontend-i18n"
          ln -sfn "$CLI_BIN/frontend-i18n" "$CONSUMER_BIN/frontend-i18n"
          echo "$CLI_BIN" >> "$GITHUB_PATH"

      - name: Verify frontend-i18n CLI
        run: frontend-i18n version

      - name: Run consumer validation with Node.js
        env:
          VALIDATION_COMMAND: ${{ inputs.validation-command }}
          VALIDATION_CONFIG: ${{ inputs.validation-config }}
          I18N_CATALOG_ADAPTER: ${{ inputs.catalog-adapter }}
          I18N_CATALOG_PATH: ${{ inputs.catalog-path }}
          I18N_CATALOG_ROLE: ${{ inputs.catalog-role }}
          I18N_CATALOG_LOCALE: ${{ inputs.catalog-locale }}
          I18N_CATALOG_CONFIG: ${{ inputs.catalog-config }}
        run: |
          if [ -n "$VALIDATION_CONFIG" ]; then
            frontend-i18n validate-project --config "$VALIDATION_CONFIG"
          else
            npm run "$VALIDATION_COMMAND"
          fi
